[settings]
# npm.package_manager is still gated behind the experimental flag.
experimental = true
npm.package_manager = "bun"

[tools]
"npm:renovate" = "43.269.3"

[tasks.validate]
description = "Validate the shared Renovate config"
# --strict also fails on deprecated fields, not just schema errors.
run = "renovate-config-validator --strict"
